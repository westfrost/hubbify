<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: "HUBBIFY" }}</title>
<meta name="theme-color" content="#0f0f14">
<link rel="icon" href="{{ '/favicon.png' | relative_url }}">
<style>
  :root { --page: #0f0f14; --card: #1b1b24; --text: #fff; --dim: #9a9aaa; --accent: #ffc800; }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body { margin: 0; background: var(--page); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  article { background: var(--card); border-radius: 18px; padding: 24px 20px; }
  h1 { margin-top: 0; line-height: 1.2; }
  h2 { margin-top: 28px; }
  a { color: var(--accent); }
  em { color: var(--dim); }
  .back { display: inline-block; margin-bottom: 16px; color: var(--dim); text-decoration: none; }
</style>
</head>
<body>
<main>
  <a class="back" href="{{ '/' | relative_url }}">← HUBBIFY</a>
  <article>
{{ content }}
  </article>
</main>
</body>
</html>
